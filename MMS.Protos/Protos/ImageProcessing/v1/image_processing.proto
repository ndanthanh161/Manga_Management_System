syntax = "proto3";
package mms.image_processing.v1;
option csharp_namespace = "MMS.Protos.ImageProcessing.V1";

service ImageProcessor {
  // Client stream upload → Server stream progress
  rpc ProcessPage(stream PageChunk) returns (stream ProcessProgress);
  // Unary: sinh thumbnail từ key có sẵn
  rpc GenerateThumbnail(GenerateThumbnailRequest) returns (ThumbnailResult);
}

message PageChunk {
  string upload_id = 1;
  bytes data = 2;
  int32 chunk_index = 3;
  bool is_last = 4;
}

enum ProcessStage {
  PROCESS_STAGE_UNSPECIFIED = 0;
  RECEIVED = 1;
  RESIZING = 2;
  OPTIMIZING = 3;
  UPLOADED = 4;
  DONE = 5;
  FAILED = 6;
}

message ProcessProgress {
  string upload_id = 1;
  ProcessStage stage = 2;
  int32 percent = 3;
  optional ProcessedAssets assets = 4;  // chỉ có khi stage=DONE
  optional string error_message = 5;    // chỉ có khi stage=FAILED
}

message ProcessedAssets {
  string original_key = 1;
  string large_key = 2;      // 1024w
  string thumbnail_key = 3;  // 256w
  int32 width = 4;
  int32 height = 5;
  int64 file_size_bytes = 6;
}

message GenerateThumbnailRequest {
  string source_key = 1;
  int32 target_width = 2;
  string output_key = 3;
}

message ThumbnailResult {
  string thumbnail_key = 1;
  int32 width = 2;
  int32 height = 3;
  int64 file_size_bytes = 4;
}
